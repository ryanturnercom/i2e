<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>i2e console · lithia</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Rock+Salt&display=swap" rel="stylesheet" />

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif;
    background: #efefef;
    color: #5f5f5f;
    font-size: 14px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  h1, h2, h3, h4 { font-family: inherit; color: #333; }
  button { font-family: inherit; }
  a { color: inherit; }
  input::placeholder, textarea::placeholder { color: #999; }
  input:focus, textarea:focus { border-color: #272727 !important; }

  /* Pulse animation used by PulseDot */
  @keyframes i2ePulse {
    0%   { transform: scale(1);   opacity: 0.55; }
    70%  { transform: scale(2.4); opacity: 0;    }
    100% { transform: scale(2.4); opacity: 0;    }
  }

  /* Subtle scrollbar for log boxes */
  pre::-webkit-scrollbar, div::-webkit-scrollbar { width: 8px; height: 8px; }
  pre::-webkit-scrollbar-thumb, div::-webkit-scrollbar-thumb {
    background: rgba(0,0,0,0.12); border-radius: 4px;
  }

  /* Loading splash */
  #i2e-splash {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #efefef;
    z-index: 100;
    transition: opacity 300ms;
  }
  #i2e-splash.gone { opacity: 0; pointer-events: none; }
  #i2e-splash .wm {
    font-family: 'Rock Salt', cursive;
    font-size: 56px;
    color: #272727;
  }
</style>
</head>
<body>

<div id="i2e-splash"><div class="wm">i2e</div></div>

<div id="i2e-root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="sidebar.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>
<script type="text/babel" src="intent.jsx"></script>
<script type="text/babel" src="pending.jsx"></script>
<script type="text/babel" src="workers.jsx"></script>
<script type="text/babel" src="logs.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script>
  // Fade splash once React renders
  const obs = new MutationObserver(() => {
    if (document.querySelector('#i2e-root > *')) {
      document.getElementById('i2e-splash').classList.add('gone');
      obs.disconnect();
    }
  });
  obs.observe(document.getElementById('i2e-root'), { childList: true, subtree: true });
</script>

</body>
</html>
